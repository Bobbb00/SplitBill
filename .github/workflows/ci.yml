name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-api:
    name: Build API (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./splitbill-api
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: ./splitbill-api/go.sum
        
    - name: Build API
      run: go build -v ./cmd/server/main.go

  build-web:
    name: Build Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./splitbill-web
    steps:
    - name: Check out code
      uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./splitbill-web/package-lock.json
        
    - name: Install dependencies
      run: npm install
      
    - name: Build Next.js
      run: npm run build
