services:
  api:
    build: .
    container_name: splitbill-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql

  web:
    build: ../splitbill-web
    container_name: splitbill-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  mysql:
    image: mysql:8.0
    container_name: splitbill-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: splitbill
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./migrations:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
